spring.application.name=My-Personal-Portfolio

spring.application.name=SpringBootThymeleafIntegration

server.port = 8091

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix =.html
spring.thymeleaf.cache=false


#database properties
spring.datasource.url=jdbc:mysql://localhost:3306/personal_test?serverTimezone=UTC&useSSL=false&characterEcncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.name = personal_test

#hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect =  org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

